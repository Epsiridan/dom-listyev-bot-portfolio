      "title": "Главное приветствие",
      "text": "🍃 Я — смотритель «Дома Листьев».\n\nЯ встречаю тех, кто подходит к порогу: читателей, авторов, художников, музыкантов и всех, кому важно говорить об искусстве.\n\nЗдесь можно искать форму, приносить странное и незавершённое, ошибаться, спорить по делу и внимательно относиться к чужой работе.\n\nЯ помогу вам открыть дверь в сообщество, предложить пост, отправить работу на конкурс или заглянуть в архив Дома.\n\nБота и сообщество создала команда «Дома Листьев».\n\nВыберите, куда идём.",
