      "title": "Стандартное описание конкурса",
      "text": "= ЭХО // м‌‌‌е‌‌‌р‌‌‌ц‌‌а‌‌‌н‌‌‌и‌‌‌е‌‌‌ =\n\nВы можете отправить работу на конкурс через этого бота.\n\nИсходный текст, на который нужно ответить, опубликован здесь:\n\n🔗 <a href=\"https://telegra.ph/fragment-iz-dnevnika-data-otsutstvuet-07-01\">Фрагмент из дневника: дата отсутствует</a>\n\nВаша задача — вступить с ним в диалог: продолжить, оспорить, перевернуть, раскрыть, опровергнуть или найти в нём то, что осталось между строк.\n\nФорма — любая литературная: стихотворение, рассказ, эссе, письмо, монолог, дневниковая запись, пьеса, заметка на полях, найденный документ — или что-то, чему вы сами найдёте название.\n\nУсловия участия:\n\n• Приём работ: с 1 по 31 июля включительно, до 21:00 по Москве.\n• Один участник — одна работа.\n• Принимается только текст: сообщением в боте или файлом .txt / .docx.\n• Ограничений по объёму нет.\n• Мы не принимаем тексты, унижающие чужое достоинство.\n• Для участия нужно сделать репост анонса конкурса в свой Telegram-канал и приложить ссылку на пост.\n• Нужно быть подписанным на каналы «Дом Листьев» и «Гильдия искусства».\n• Если вы использовали ИИ как вспомогательный инструмент, приложите ссылку на диалог.\n\nКогда будете готовы, нажмите кнопку ниже.\n",
