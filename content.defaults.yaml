    "community_rules": {
      "title": "Правила сообщества",
      "text": "🍃🍂 Добро пожаловать в «Дом Листьев»!\n\nПеред тем как что-то писать в чате, пожалуйста, прочтите свод простых правил.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n1. Уважение к участникам\n\nКритика допустима. Унижение — нет.\n\n❌ Запрещены:\n\n- переходы на личности;\n- травля;\n- дискриминация в любых её проявлениях;\n- пассивная агрессия;\n- попытки намеренно задеть или спровоцировать человека;\n- оскорбление чьих-либо чувств;\n- нарушение законодательства РФ: админы не хотят сесть, как и вы. Надеемся на понимание.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n2. Искусство важнее шума\n\nСообщество создано для текстов, живописи, музыки, визуального и/или интерактивного искусства и обсуждения творчества.\n\n‼️ Для флуда и мемов создан отдельный чат. В основных чатах флуд, бессодержательные споры и намеренное засорение чата будут удаляться.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n3. Без «ироничных разрушителей»\n\nЕсли ваша цель:\n\n- высмеивать чужое творчество;\n- провоцировать конфликты;\n- устраивать «социальные эксперименты»;\n- превращать обсуждение в токсичный перформанс —\n\nвы ошиблись дверью.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n4. Критика должна быть содержательной\n\n«Это плохо» или «это банально» — не критика.\n\nНормальная критика объясняет:\n\n- что именно не работает и почему;\n- как это воспринимается.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n5. Без политических и идеологических срачей\n\n‼️ ВАЖНО: искусство может быть политичным. Чат — нет.\n\nПопытки превращать обсуждения в агрессивные споры о политике, идеологиях и религиях будут пресекаться.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n6. О модерации\n\nАдминистрация оставляет за собой право удалять:\n\n- токсичные обсуждения;\n- провокации;\n- троллинг;\n- людей, которые систематически портят атмосферу, без публичных дебатов о модерации.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\n7. Дом Листьев — это место для людей\n\nЗдесь можно ошибаться, искать форму, выкладывать незавершённое, пробовать странное.\n\nНо нельзя делать других участников материалом для самоутверждения.\n\n┈ ┈ ┈ ⌂ ┈ ┈ ┈\n\nЕсли правила вам близки — нажмите кнопку ниже.\n\nНажимая её, вы подтверждаете, что принимаете правила нашего сообщества. 🤍\n",
      "send_mode": "auto"
    },
